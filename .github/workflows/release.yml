name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Opens or updates the "Version packages" PR while changesets are pending;
      # once that PR is merged, publishes to npm, tags and creates the GitHub release.
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
